name: Publish SipSpark static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.current=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script': self.in_script=True; self.current=[]
              def handle_data(self, data):
                  if self.in_script: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      self.scripts.append(''.join(self.current)); self.in_script=False
          parser=Scripts()
          with open('app.html', encoding='utf-8') as f: parser.feed(f.read())
          if not parser.scripts: raise SystemExit('No inline script found in app.html')
          with open('/tmp/sipspark-app.js','w',encoding='utf-8') as f: f.write('\n'.join(parser.scripts))
          PY
          node --check /tmp/sipspark-app.js
          node --check worker/index.js
      - name: Verify AI Worker health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://sipspark-ai.chenzhe223.workers.dev/health -o /tmp/sipspark-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/sipspark-health.json', encoding='utf-8') as f:
              data=json.load(f)
          if not data.get('ok') or data.get('service') != 'SipSpark AI':
              raise SystemExit('SipSpark AI Worker health check failed')
          print('SipSpark AI Worker is reachable')
          PY
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.html moments.html _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
