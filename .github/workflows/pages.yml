name: Publish SipSpark static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_script=False; self.current=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script': self.in_script=True; self.current=[]
              def handle_data(self, data):
                  if self.in_script: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      self.scripts.append(''.join(self.current)); self.in_script=False
          parser=Scripts()
          with open('app.html', encoding='utf-8') as f: parser.feed(f.read())
          if not parser.scripts: raise SystemExit('No inline script found in app.html')
          with open('/tmp/sipspark-app.js','w',encoding='utf-8') as f: f.write('\n'.join(parser.scripts))
          PY
          node --check /tmp/sipspark-app.js
          cp worker/index.js /tmp/sipspark-worker.mjs
          node --check /tmp/sipspark-worker.mjs
      - name: Verify AI Worker health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://sipspark-ai.chenzhe223.workers.dev/health -o /tmp/sipspark-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/sipspark-health.json', encoding='utf-8') as f:
              data=json.load(f)
          if not data.get('ok') or data.get('service') != 'SipSpark AI':
              raise SystemExit('SipSpark AI Worker health check failed')
          print('SipSpark AI Worker is reachable')
          PY
      - name: Smoke-test AI recipe generation
        timeout-minutes: 2
        run: |
          set +e
          status=$(curl --silent --show-error --max-time 70 --retry 1 --retry-delay 2 -w '%{http_code}' -X POST https://sipspark-ai.chenzhe223.workers.dev/api/mix -H 'Content-Type: application/json' -H 'Origin: https://chenzhe223-tech.github.io' --data '{"ingredients":"红柚金银花果汁、长相思、冰块；只有杯子，不额外购买材料。","mood":"清爽微醺"}' -o /tmp/sipspark-mix.json)
          curl_status=$?
          set -e
          echo "AI recipe endpoint HTTP status: ${status:-curl-error}"
          echo "AI recipe endpoint response:"
          cat /tmp/sipspark-mix.json || true
          if [ "$curl_status" -ne 0 ]; then exit "$curl_status"; fi
          python3 - <<'PY'
          import json
          with open('/tmp/sipspark-mix.json', encoding='utf-8') as f:
              data=json.load(f)
          recipes=data.get('recipes')
          if not isinstance(recipes,list) or len(recipes)<3:
              raise SystemExit('AI endpoint did not return at least three recipes: '+str(data.get('error','unknown error')))
          allowed=('红柚金银花果汁','长相思','冰块')
          for recipe in recipes[:3]:
              ingredients=recipe.get('ingredients',[])
              if not ingredients:
                  raise SystemExit('AI returned a recipe without ingredients')
              for item in ingredients:
                  name=item.get('name','')
                  if not any(token in name or name in token for token in allowed):
                      raise SystemExit('AI returned an ingredient outside this smoke-test set: '+name)
          print('AI recipe endpoint returned three ingredient-validated recipes')
          PY
      - name: Smoke-test AI image generation
        timeout-minutes: 3
        run: |
          set +e
          status=$(curl --silent --show-error --max-time 150 --retry 1 --retry-delay 2 -w '%{http_code}' -X POST https://sipspark-ai.chenzhe223.workers.dev/api/image -H 'Content-Type: application/json' -H 'Origin: https://chenzhe223-tech.github.io' --data '{"name":"柚光漫游","description":"清爽的红柚与白葡萄酒风味","ingredients":"红柚金银花果汁、长相思、冰块","mood":"自然光下的清爽特调"}' -o /tmp/sipspark-image.json)
          curl_status=$?
          set -e
          echo "AI image endpoint HTTP status: ${status:-curl-error}"
          if [ "$curl_status" -ne 0 ]; then cat /tmp/sipspark-image.json 2>/dev/null || true; exit "$curl_status"; fi
          python3 - <<'PY'
          import base64, json
          with open('/tmp/sipspark-image.json', encoding='utf-8') as f:
              data=json.load(f)
          image=data.get('image')
          if not isinstance(image,str) or len(image)<1000:
              raise SystemExit('AI image endpoint did not return a usable base64 image: '+str(data.get('error','missing image')))
          try:
              decoded=base64.b64decode(image,validate=True)
          except Exception as e:
              raise SystemExit('AI image response is not valid base64: '+str(e))
          head=list(decoded[:8])
          if not (head[:3] == [255,216,255] or head == [137,80,78,71,13,10,26,10]):
              raise SystemExit('AI image response is not a recognizable JPEG or PNG')
          print('AI image endpoint returned a decodable image ('+str(len(decoded))+' bytes)')
          PY
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.html moments.html _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
