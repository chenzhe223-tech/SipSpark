</style></head><body><div class="wrap"><header><a class="brand" href="index.html">随调 <span>SipSpark</span></a><a class="back" href="index.html">← 返回品牌看板</a></header><section class="intro"><div class="eyebrow">SIPSPARK / VISUAL JOURNAL</div><h1>少一点设计感，<br>多一点真实生活。</h1><p>以真实生活摄影为主视觉，保留暖纸白、柚皮粉、鼠尾草绿与墨岩黑的低饱和配色。文字只做轻量点题，让光线、玻璃、桌面和当下的场景成为主角。点击卡片可打开对应摄影图像源。</p><div class="toolbar"><button class="btn alt" id="photo-mode">隐藏文字，专注照片</button></div></section><section class="grid" id="grid"></section>

{n:'03',name:'旅途灵感',sub:'MADE FOR THIS MOMENT',url:'https://images.pexels.com/photos/34535726/pexels-photo-34535726.jpeg?auto=compress&cs=tinysrgb&w=1200',page:'https://www.pexels.com/photo/airplane-window-view-with-smartphone-at-sunset-34535726/',title:'你手边有什么？',body:'从当下已有的材料，探索属于自己的风味。',light:false},

const grid=document.getElementById('grid');let photoOnly=false;
function createCard(p){const card=document.createElement('article');card.className='card';const poster=document.createElement('div');poster.className='poster'+(p.light?' light':'');poster.style.backgroundImage='url("'+p.url+'")';poster.innerHTML='<span class="num">'+p.n+' / SIPSPARK</span><div><h2>'+p.title+'</h2><p>'+p.body+'</p><span class="sig">'+p.sub+'</span></div>';poster.addEventListener('click',()=>window.open(p.page,'_blank','noopener'));poster.title='点击打开原始照片';const label=document.createElement('div');label.className='label';label.innerHTML='<div><strong>'+p.n+' · '+p.name+'</strong><small>'+p.sub+'</small></div><button type="button">打开原图 ↗</button>';label.querySelector('button').addEventListener('click',()=>window.open(p.page,'_blank','noopener'));card.append(poster,label);return card}
photos.forEach(p=>grid.append(createCard(p)));
document.getElementById('photo-mode').addEventListener('click',function(){photoOnly=!photoOnly;grid.querySelectorAll('.poster').forEach((el,i)=>{el.style.backgroundImage='url("'+photos[i].url+'")';if(photoOnly){el.innerHTML='';el.style.padding='0'}else{el.style.padding='22px';el.innerHTML='<span class="num">'+photos[i].n+' / SIPSPARK</span><div><h2>'+photos[i].title+'</h2><p>'+photos[i].body+'</p><span class="sig">'+photos[i].sub+'</span></div>'}});this.textContent=photoOnly?'恢复品牌文案':'仅看真实照片'});
